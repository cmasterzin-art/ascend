name: Compilar ASCEND
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  distribuir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Conferir APK já compilado e testado no Cloud
        working-directory: downloads
        run: sha256sum -c ASCEND-1.6.2.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ASCEND-Android
          path: downloads/ASCEND-1.6.2.apk
          retention-days: 30
          if-no-files-found: error
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar assinatura de atualizações
        env:
          ASCEND_KEYSTORE_BASE64: ${{ secrets.ASCEND_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$ASCEND_KEYSTORE_BASE64" ]; then
            printf '%s' "$ASCEND_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            echo 'Sem chave preservada: esta compilação terá assinatura nova. Consulte ASSINATURA.md.'
          fi
      - name: Testar e compilar
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ASCEND-Compilacao
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Resultados-dos-testes
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14
