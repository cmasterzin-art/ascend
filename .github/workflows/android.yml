name: Compilar ASCEND
on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/ascend-1.6.9']
permissions:
  contents: write
jobs:
  distribuir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Conferir APK já compilado e testado
        if: hashFiles('downloads/ASCEND-1.6.9.apk.sha256') != ''
        working-directory: downloads
        run: sha256sum -c ASCEND-1.6.9.apk.sha256
      - uses: actions/upload-artifact@v4
        if: hashFiles('downloads/ASCEND-1.6.9.apk.sha256') != ''
        with:
          name: ASCEND-Android
          path: downloads/ASCEND-1.6.9.apk
          retention-days: 30
          if-no-files-found: error
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Desempacotar recursos gráficos binários
        run: |
          python3 -c "import PIL" 2>/dev/null || pip install --break-system-packages -q pillow || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil; }
          python3 - <<'PY'
          import base64, glob, json, pathlib
          from PIL import Image, ImageDraw
          chunks = sorted(glob.glob('assets_chunk_*.txt'))
          if chunks:
              raw = ''.join(
                  pathlib.Path(c).read_text(encoding='utf-8').replace('\n', '').replace('\r', '')
                  for c in chunks
              )
              data = json.loads(raw)
              for rel, b64 in data.items():
                  out = pathlib.Path(rel)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(base64.b64decode(b64))
              for c in chunks:
                  pathlib.Path(c).unlink(missing_ok=True)
              print('Unpacked chunks:', len(chunks), 'files:', len(data))
          for old in glob.glob('build_assets*.b64'):
              pathlib.Path(old).unlink(missing_ok=True)
          res = pathlib.Path('app/src/main/res/drawable-nodpi')
          if (res / 'carved_emblems.webp').exists():
              pathlib.Path('docs/screenshots/v1.6.9').mkdir(parents=True, exist_ok=True)
              board = Image.new('RGBA', (1200, 820), (12, 16, 20, 255))
              draw = ImageDraw.Draw(board)
              draw.text((36, 16), 'ASCEND 1.6.9 — PRANCHA DE RECURSOS (Nordic Cinematic UI)', fill=(214, 186, 132, 255))
              slots = [
                  ('carved_emblems.webp', 'carved_emblems (5 classes + 5 atributos)', 36, 44, 558, 223),
                  ('carved_seals.webp', 'carved_seals (6 selos cerimoniais)', 36, 304, 468, 312),
                  ('plate_iron.webp', 'plate_iron (ferro forjado)', 36, 654, 540, 108),
                  ('artifact_frame.webp', 'artifact_frame (nicho Urnes)', 628, 44, 224, 224),
                  ('widget_slate.webp', 'widget_slate (ardosia vulcanica)', 628, 304, 536, 301),
                  ('plate_bronze.webp', 'plate_bronze (bronze oxidado)', 628, 654, 536, 108),
              ]
              for fname, label, x, y, tw, th in slots:
                  p = res / fname
                  if not p.exists():
                      continue
                  im = Image.open(p).convert('RGBA').resize((tw, th), getattr(Image, 'Resampling', Image).LANCZOS)
                  draw.rectangle([x - 2, y - 2, x + tw + 1, y + th + 1], outline=(46, 54, 62, 255), width=1)
                  board.paste(im, (x, y), im)
                  draw.text((x, y + th + 6), label, fill=(176, 184, 192, 255))
              board.convert('RGB').save('docs/screenshots/v1.6.9/prancha-recursos-169.png', 'PNG', optimize=True)
              print('Saved prancha-recursos-169.png')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar assinatura de atualizações
        env:
          ASCEND_KEYSTORE_BASE64: ${{ secrets.ASCEND_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$ASCEND_KEYSTORE_BASE64" ]; then
            printf '%s' "$ASCEND_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            echo 'Sem chave preservada no secret ASCEND_KEYSTORE_BASE64: compilação usará chave padrão de debug.'
          fi
      - name: Testar, compilar e executar Lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon > build_log.txt 2>&1 || { cat build_log.txt; exit 1; }
          cat build_log.txt
      - name: Consolidar relatórios, capturas e verificação do APK
        id: verify
        run: |
          mkdir -p docs/validation docs/screenshots/v1.6.9
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          totals = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          for p in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              r = ET.parse(p).getroot()
              for k in totals:
                  totals[k] += int(r.attrib.get(k, 0))
          with open('docs/validation/BUILD-1.6.9.txt', 'w') as out:
              out.write(str(totals) + '\n')
              with open('build_log.txt') as log:
                  out.write(log.read())
          print(totals)
          PY
          cp app/build/test-results/testDebugUnitTest/TEST-*.xml docs/validation/
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            cp app/build/reports/lint-results-debug.txt docs/validation/LINT-1.6.9.txt
          fi
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BYTES=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          {
            "$BT/aapt2" dump badging "$APK" | head -n 1
            echo "Bytes: $BYTES"
            echo "SHA256: $SHA"
            if "$BT/zipalign" -c 4 "$APK"; then echo "Zipalign OK"; else echo "Zipalign FAIL"; fi
            "$BT/apksigner" verify --verbose --print-certs "$APK"
            "$BT/aapt2" dump permissions "$APK"
          } > docs/validation/APK-1.6.9.txt
          cat docs/validation/APK-1.6.9.txt
          EXPECTED="e1f003efe40d53754db66325c40177178aaa81d4ad02ab910c85642c681caae4"
          if grep -qi "$EXPECTED" docs/validation/APK-1.6.9.txt; then
            echo "compatible=true" >> "$GITHUB_OUTPUT"
            cp "$APK" downloads/ASCEND-1.6.9.apk
            (cd downloads && sha256sum ASCEND-1.6.9.apk > ASCEND-1.6.9.apk.sha256)
          else
            echo "compatible=false" >> "$GITHUB_OUTPUT"
          fi
          for f in tour-jornada.png tour-habitos.png tour-missoes.png tour-sagas.png tour-heroi.png tour-inventario.png tour-atlas.png tour-cronica.png tour-memorias.png tour-widget.png cronometro-165.png jornada-320-texto130.png planejador-160.png planejador-320-160.png analises-160.png inventario-320-texto130.png saga-320-texto130.png widget-compacto-150.png widget-expandido-150.png widget-escuro-150.png widget-estreito-130-151.png; do
            if [ -f "app/build/reports/screenshots/$f" ]; then
              cp "app/build/reports/screenshots/$f" "docs/screenshots/v1.6.9/$f"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ASCEND-Compilacao
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Resultados-dos-testes
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.txt
            app/build/reports/screenshots
          retention-days: 14
      - name: Publicar capturas e validação na branch
        if: github.ref_name == 'feat/ascend-1.6.9'
        run: |
          rm -f build_log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch assets_chunk_*.txt build_assets*.b64
          git add app/src/main/res/drawable-nodpi docs/art/concepts docs/validation docs/screenshots/v1.6.9
          if [ "${{ steps.verify.outputs.compatible }}" = "true" ]; then
            git add downloads/ASCEND-1.6.9.apk downloads/ASCEND-1.6.9.apk.sha256
          fi
          if ! git diff --cached --quiet; then
            git commit -m "ci: unpack 1.6.9 binary assets and record validation and screenshots [skip ci]"
            git pull --rebase origin feat/ascend-1.6.9
            git push origin feat/ascend-1.6.9
          fi
      - name: Registrar log de erro na branch em caso de falha
        if: failure() && github.ref_name == 'feat/ascend-1.6.9'
        run: |
          mkdir -p docs/validation
          if [ -f build_log.txt ]; then cp build_log.txt docs/validation/BUILD-1.6.9.txt; fi
          cp app/build/test-results/testDebugUnitTest/TEST-*.xml docs/validation/ 2>/dev/null || true
          if [ -f app/build/reports/lint-results-debug.txt ]; then cp app/build/reports/lint-results-debug.txt docs/validation/LINT-1.6.9.txt; fi
          rm -f build_log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation
          if ! git diff --cached --quiet; then
            git commit -m "ci: registrar log de falha da compilacao [skip ci]"
            git pull --rebase origin feat/ascend-1.6.9
            git push origin feat/ascend-1.6.9
          fi
